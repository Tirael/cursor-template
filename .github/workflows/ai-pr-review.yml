name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # TODO: Pin to full SHA for security:
      # gh api repos/sasa-tomic/argus-code-review-action/commits/v1 --jq .sha
      - uses: sasa-tomic/argus-code-review-action@b594e0d53698974a63483a6f57957f0a287eea2c
        with:
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}